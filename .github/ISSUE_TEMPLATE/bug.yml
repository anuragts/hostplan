name: Bug report
description: Report a reproducible problem in the CLI, viewer, or hosted app.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not paste plan share codes, tokens, private plan contents, or filesystem paths that reveal personal information.
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - CLI
        - Local viewer
        - Hosted viewer
        - Authentication
        - Agent deep link
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or b3fabdb
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: List the smallest safe sequence that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Bun and Node versions, browser or coding-agent app, and local or hosted mode.
    validations:
      required: true
