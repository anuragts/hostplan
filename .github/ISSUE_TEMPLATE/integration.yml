name: Agent integration report
description: Report working or broken Hostplan behavior in a coding-agent app.
title: "integration: "
labels:
  - integration
body:
  - type: dropdown
    id: agent
    attributes:
      label: Coding-agent app
      options:
        - Codex
        - Claude Code
        - Cursor
        - Another app
    validations:
      required: true
  - type: input
    id: agent-version
    attributes:
      label: App version
    validations:
      required: true
  - type: dropdown
    id: plan-location
    attributes:
      label: Plan location
      options:
        - Locally owned plan
        - Private hosted plan
        - Public hosted plan
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed handoff behavior
      description: Describe what opened and which context was prepared. Do not include the plan id, code, URL, body, or local path.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed plan ids, share codes, contents, tokens, and personal filesystem paths.
          required: true
